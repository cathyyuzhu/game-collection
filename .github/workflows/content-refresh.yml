# Cloud-native content production pipeline
# Runs LLM rewriting + DB seed asynchronously (outside request path)
# Triggers: daily at 06:00 & 18:00 UTC, or manual dispatch
name: Refresh Game Content

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Switch Prisma to PostgreSQL provider
        run: sed -i 's/provider = "sqlite"/provider = "postgresql"/' web/prisma/schema.prisma

      - name: Generate Prisma Client
        run: cd web && npx prisma@5 generate

      - name: Push schema to production DB
        run: cd web && npx prisma@5 db push
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Seed / refresh content
        run: cd web && npm run seed
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
